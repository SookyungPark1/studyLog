name: Validate StudyLog
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: studylog
          MYSQL_USER: studylog
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B verify
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - name: MySQL integration smoke
        env:
          DB_PASSWORD: ci-only-password
        run: |
          java -jar backend/target/studylog-0.1.0.jar > /tmp/studylog.log 2>&1 &
          trap 'cat /tmp/studylog.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/lesson >/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py
